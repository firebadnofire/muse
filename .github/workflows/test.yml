name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y zsh vim htop python3-pexpect
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - run: make smoke
      - run: MUSE_TEST_SHELL=zsh python3 scripts/pty-smoke.py ./bin/muse
